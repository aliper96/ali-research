version: "3.9"

services:
  # -----------------------------------------------------------------------
  # LaTeX compilation service
  # Recibe .zip LaTeX → compila con latexmk → devuelve PDF
  # -----------------------------------------------------------------------
  latex-compiler:
    build:
      context: ./docker/latex
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    mem_limit: 2g
    cpus: "1.5"
    tmpfs:
      - /tmp/latex_outputs   # escritura en memoria, no persiste
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # -----------------------------------------------------------------------
  # Descomentar si quieres correr el backend FastAPI también en Docker.
  # Por defecto se asume que corre localmente (uvicorn en puerto 8000).
